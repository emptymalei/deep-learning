name: Publish Docs Test

# Builds the site on pull requests, so a broken build fails before it reaches
# main. pre-commit runs in its own workflow (pre-commit.yaml).
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Build the site with Zensical
        run: scripts/build_site.sh
