name: Publish Docs without PDF

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      directory:
        description: 'Release it'
        default: 'gogogo'
        required: false


jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install Poetry
        run: python -m pip install "poetry==2.1.2"
      - name: Install docs dependencies
        # Only the docs toolchain; notebook dependencies (PyTorch etc.) are not
        # needed to build the site.
        run: poetry install --only main --no-root
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Build marimo playgrounds
        # WebAssembly exports of playgrounds/*.py into dl/assets/playgrounds/
        # (git-ignored), which MkDocs then copies into the site.
        run: scripts/build_playgrounds.sh
        env:
          MARIMO_VERSION: "0.25.2"
      - uses: nikeee/setup-pandoc@v1
      - run: poetry run mkdocs gh-deploy --force
