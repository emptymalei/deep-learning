name: Publish Docs

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

# One deploy at a time, in push order.
concurrency:
  group: publish-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Build the site with Zensical
        run: scripts/build_site.sh
      - name: Publish build/site to the gh-pages branch
        # --no-jekyll adds .nojekyll; --cname keeps the custom domain.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uvx ghp-import==2.1.0 --no-jekyll --cname dl.leima.is --push --force \
            --message "Deploy ${GITHUB_SHA::7} (Zensical)" build/site
