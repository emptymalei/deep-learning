name: Publish Docs

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read # to know which previews belong to open pull requests

# One deploy at a time, in push order.
concurrency:
  group: publish-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Build the site with Zensical
        run: scripts/build_site.sh
      - name: Publish build/site to the gh-pages branch
        # Keeps the previews of open pull requests (pr-preview/), see the script.
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/deploy_site.sh build/site
