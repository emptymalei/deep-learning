[tool.poetry]
name = "deep-learning"
version = "0.1.0"
description = "Time Series Forecasting with Deep Learning"
authors = ["LM <hi@leima.is>"]
readme = "README.md"
packages = [{include = "ts_dl_utils", from = "dl/notebooks/"}]

# The site is built with Zensical through uv (scripts/build_site.sh) and needs
# nothing from Poetry. Poetry manages the notebook dependencies in the groups
# below.
[tool.poetry.dependencies]
# torchvision (pulled in by torchdyn) declares Python 3.14.1 unsupported, so
# start the range after it.
python = ">=3.14.2,<3.15"


[tool.poetry.group.ml.dependencies]
numpy = "^2.5.4"
statsmodels = "^0.15.0"
loguru = "^0.8.0"
tabulate = "^0.10.0"
dtaidistance = "^2.5.1"
torchdr = "^0.5"


[tool.poetry.group.darts.dependencies]
darts = "^0.48.1"
# darts only wraps LightGBM; tree_darts_boosted_tree.py uses LightGBMModel.
lightgbm = "^4.7.0"

[tool.poetry.group.notebook.dependencies]
ipykernel = "^7.4.0"
jupytext = "^1.19.6"


[tool.poetry.group.visualization.dependencies]
seaborn = "^0.13.2"
opentsne = "^1.0.4"
plotly = "^7.1.0"


[tool.poetry.group.data.dependencies]
eerily = "^0.2.1"


[tool.poetry.group.torch.dependencies]
lightning = "^2.6.6"
tensorboard = "^2.21.0"
torchmetrics = "^1.9.0"
torchdyn = "^1.0.6"
torch-tb-profiler = "^0.4.3"
torch = "^2.15.0"


[tool.poetry.group.nixtla.dependencies]
neuralforecast = "^3.3.1"
mlforecast = "^1.1.0"
statsforecast = "^2.1.1"
datasetsforecast = "^1.1.0"
# The notebooks evaluate forecasts with utilsforecast (datasetsforecast 1.x
# dropped its evaluation module).
utilsforecast = "^0.2.17"


[tool.poetry.group.huggingface.dependencies]
transformers = "^5.22.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
