[tool.poetry]
name = "deep-learning"
version = "0.1.0"
description = "Time Series Forecasting with Deep Learning"
authors = ["LM <hi@leima.is>"]
readme = "README.md"
packages = [{include = "ts_dl_utils", from = "dl/notebooks/"}]

# The site is built with Zensical through uv (scripts/build_site.sh) and needs
# nothing from Poetry. Poetry manages the notebook dependencies in the groups
# below.
[tool.poetry.dependencies]
python = ">=3.12,<3.13"


[tool.poetry.group.ml.dependencies]
# 1.26 is the first NumPy with Python 3.12 wheels; stay below 2.0 so older
# notebook code (e.g. darts 0.26) keeps working.
numpy = "^1.26.4"
# 0.14.5+ has Python 3.12 wheels; stay on the 0.14 line used with darts 0.26.
statsmodels = ">=0.14.5,<0.15"
# Not used directly: statsforecast pulls it in (via fugue/triad). pyarrow 26
# requires NumPy 2, so stay on 25.x while NumPy is pinned below 2.0.
pyarrow = ">=14,<26"
loguru = "^0.7.2"
tabulate = "^0.9.0"
dtaidistance = "^2.3.12"
torchdr = "^0.3"


[tool.poetry.group.darts.dependencies]
darts = "^0.26.0"

[tool.poetry.group.notebook.dependencies]
ipykernel = "^6.21.1"
jupytext = "^1.15.2"


[tool.poetry.group.visualization.dependencies]
seaborn = "^0.13.2"
opentsne = "^1.0.2"
plotly = "^6.1.1"


[tool.poetry.group.data.dependencies]
eerily = "^0.2.1"
ts-bolt = "0.0.7"


[tool.poetry.group.torch.dependencies]
lightning = "^2.1.2"
tensorboard = "^2.15.1"
torchmetrics = "^1.2.0"
torchdyn = "^1.0.6"
torch-tb-profiler = "^0.4.3"
torch = "^2.5.1"


[tool.poetry.group.nixtla.dependencies]
neuralforecast = "^1.7.4"
mlforecast = "^0.13.4"
statsforecast = "^1.7.6"
datasetsforecast = "^0.0.8"


[tool.poetry.group.huggingface.dependencies]
transformers = "^4.44.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
